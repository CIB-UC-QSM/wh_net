[project]
name = "wh-net"
version = "0.1.0"
description = "WHNet and WH-TV reconstruction for quantitative susceptibility mapping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comet-ml>=3.58.2",
    "matplotlib>=3.10.9",
    "nibabel>=5.4.2",
    "numpy>=2.4.6",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "tqdm>=4.68.1",
]

[project.scripts]
whnet-train = "whnet.training:main"
wh-tv-evaluate = "whnet.adaptive_wh_tv_validation:main"
wh-tv-train = "whnet.adaptive_wh_tv_training:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
